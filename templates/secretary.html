{% extends "base.html" %}{% block content %}<section class="dash"><p class="eyebrow">SECRETARY PORTAL</p><h1>Secretary Dashboard</h1><div class="panel"><h2>Create Property</h2><form method="post" action="/property/create" class="form gridform"><input name="title" placeholder="Title" required><input name="location" placeholder="Location" required><select name="property_type"><option>Apartment</option><option>Villa</option><option>House</option></select><input name="rent" type="number" placeholder="Rent" required><select name="status"><option>Available</option><option>Rented</option><option>Maintenance</option></select><input name="description" placeholder="Description"><button class="btn">Create</button></form></div>
<div class="panel"><h2>Property CRUD</h2>{% for p in properties %}<form method="post" action="/property/{{p.id}}/edit" class="edit"><input name="title" value="{{p.title}}"><input name="location" value="{{p.location}}"><input name="rent" value="{{p.rent}}" type="number"><select name="status"><option {%if p.status=="Available"%}selected{%endif%}>Available</option><option {%if p.status=="Rented"%}selected{%endif%}>Rented</option><option {%if p.status=="Maintenance"%}selected{%endif%}>Maintenance</option></select><input type="hidden" name="property_type" value="{{p.property_type}}"><input type="hidden" name="description" value="{{p.description}}"><button class="btn">Update</button></form>{% endfor %}</div>
<div class="panel"><h2>Complaint Management</h2>{% for c in complaints %}<div class="row"><span><b>{{c.title}}</b><small>{{c.resident_name}} • {{c.category}}</small></span><form method="post" action="/complaint/{{c.id}}/status"><select name="status"><option>Pending</option><option>In Progress</option><option>Resolved</option></select><button class="link">Update</button></form></div>{% endfor %}</div></section>{% endblock %}
