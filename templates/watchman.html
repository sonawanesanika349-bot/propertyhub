{% extends "base.html" %}{% block content %}<section class="dash"><p class="eyebrow">SECURITY PORTAL</p><h1>Watchman Dashboard</h1><div class="two"><div class="panel"><h2>Register Visitor</h2><form method="post" action="/visitor/create" class="form"><input name="visitor_name" placeholder="Visitor name" required><input name="phone" placeholder="Phone"><input name="purpose" placeholder="Purpose"><input type="date" name="visit_date" required><button class="btn">Add Visitor</button></form></div><div class="panel"><h2>Visitor Log</h2>{% for v in visitors %}<div class="row"><span><b>{{v.visitor_name}}</b><small>{{v.purpose}} • {{v.visit_date}}</small></span><form method="post" action="/visitor/{{v.id}}/status"><select name="status"><option>Expected</option><option>Entered</option><option>Exited</option></select><button class="link">Save</button></form></div>{% else %}<p>No visitors.</p>{% endfor %}</div></div></section>{% endblock %}
